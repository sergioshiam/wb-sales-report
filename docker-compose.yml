# Два контейнера: база данных PostgreSQL и наше приложение.
# Запуск: docker compose up --build   →   открыть http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wb
      POSTGRES_PASSWORD: wb
      POSTGRES_DB: wb_report
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные базы сохраняются между перезапусками
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb -d wb_report"]
      interval: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://wb:wb@db:5432/wb_report
      WB_TOKEN: ${WB_TOKEN:-}             # берётся из файла .env; пусто → демо-режим
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
